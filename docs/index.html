<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/restaurant-day/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Restaurant Day - Restaurant Operations Calendar">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Restaurant Day — Operations Calendar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Restaurant Day</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Browser notifications. The app calls rdNotifyArm() once someone has signed
    in; the permission prompt then rides on their next tap, because browsers
    refuse the request without a real gesture. rdNotify() stays quiet while the
    tab is in front — the in-app banner covers that case.
  -->
  <script>
    (function () {
      var armed = false;
      function has() { return typeof Notification !== 'undefined'; }

      window.rdNotifySupported = function () {
        try { return has(); } catch (e) { return false; }
      };

      window.rdNotifyArm = function () {
        try {
          if (armed || !has() || Notification.permission !== 'default') return;
          armed = true;
          var ask = function () {
            document.removeEventListener('pointerdown', ask, true);
            document.removeEventListener('keydown', ask, true);
            try { Notification.requestPermission(); } catch (e) {}
          };
          document.addEventListener('pointerdown', ask, true);
          document.addEventListener('keydown', ask, true);
        } catch (e) {}
      };

      window.rdNotify = function (title, body) {
        try {
          if (!has() || Notification.permission !== 'granted') return;
          if (document.visibilityState === 'visible') return;
          var n = new Notification(title, {
            body: body,
            icon: 'icons/Icon-192.png',
            badge: 'icons/Icon-192.png',
            tag: 'restaurant-day-' + Date.now()
          });
          n.onclick = function () { window.focus(); n.close(); };
        } catch (e) {}
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
