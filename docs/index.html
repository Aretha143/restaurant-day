<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/restaurant-day/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Restaurant Day - Restaurant Operations Calendar">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Restaurant Day — Operations Calendar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Restaurant Day</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Browser notifications. The app can ask for permission outright (from a
    button, which counts as the gesture browsers require), check the current
    state, raise an update popup, and fire a test one. rdNotify() stays quiet
    while the tab is in front — the in-app banner covers that case — while
    rdNotifyTest() always shows, so a person can prove it works.
  -->
  <script>
    (function () {
      function has() { return typeof Notification !== 'undefined'; }

      window.rdNotifySupported = function () {
        try { return has() && typeof Notification.requestPermission === 'function'; }
        catch (e) { return false; }
      };

      window.rdNotifyPermission = function () {
        try { return has() ? Notification.permission : 'unsupported'; }
        catch (e) { return 'unsupported'; }
      };

      window.rdNotifyRequest = function () {
        try {
          if (!has()) return;
          Notification.requestPermission();
        } catch (e) {}
      };

      // Kept for older builds; asking outright is better.
      window.rdNotifyArm = function () {
        try {
          if (!has() || Notification.permission !== 'default') return;
          var ask = function () {
            document.removeEventListener('pointerdown', ask, true);
            try { Notification.requestPermission(); } catch (e) {}
          };
          document.addEventListener('pointerdown', ask, true);
        } catch (e) {}
      };

      function raise(title, body) {
        var n = new Notification(title, {
          body: body,
          icon: 'icons/Icon-192.png',
          badge: 'icons/Icon-192.png',
          tag: 'restaurant-day-' + Date.now()
        });
        n.onclick = function () { window.focus(); n.close(); };
      }

      window.rdNotify = function (title, body) {
        try {
          if (!has() || Notification.permission !== 'granted') return;
          if (document.visibilityState === 'visible') return;
          raise(title, body);
        } catch (e) {}
      };

      window.rdNotifyTest = function (title, body) {
        try {
          if (!has() || Notification.permission !== 'granted') return false;
          raise(title, body);
          return true;
        } catch (e) { return false; }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
