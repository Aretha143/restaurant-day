<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1F27"/>
      <stop offset="55%" stop-color="#121419"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="120" y1="92" x2="400" y2="424">
      <stop offset="0%" stop-color="#F2DC93"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A9832A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#D4AF37" stroke-opacity="0.28" stroke-width="6"/>
  <rect x="20" y="20" width="472" height="220" rx="100" fill="url(#sheen)"/>

  <!-- calendar hangers -->
  <g stroke="url(#gold)" stroke-width="24" stroke-linecap="round">
    <path d="M176 92v52"/>
    <path d="M336 92v52"/>
  </g>

  <!-- calendar body -->
  <rect x="88" y="122" width="336" height="302" rx="48" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <path d="M88 204h336" stroke="url(#gold)" stroke-width="24"/>

  <!-- plate -->
  <circle cx="256" cy="318" r="62" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="256" cy="318" r="26" fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="9"/>

  <!-- cutlery -->
  <g stroke="url(#gold)" stroke-width="16" stroke-linecap="round">
    <path d="M158 272v92"/>
    <path d="M354 272v92"/>
  </g>
</svg>
